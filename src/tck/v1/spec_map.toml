# Spec map for ACP v1: which parts of the spec define rules that other parts assume without
# linking to them, and which spec rules the TCK deliberately does not test. Used when comparing
# spec revisions (a change to a core doc or core `$def` means re-checking every area that depends
# on it, not just the changed lines). Loaded by `tck.common.spec_map`.
#
# Core doc entries:
#   path      doc path in the spec repo (draft tree, `docs/protocol/v1/draft/*.mdx`)
#   sections  optional: heading titles exactly as written in the doc; a section covers its
#             subsections. Omit it when the whole doc is core.
#   code      optional: repo-relative TCK paths that implement the doc's cross-cutting rules
#   reason    why the doc is core
#
# Ledger of deliberate non-requirements, one `[[not_requirement]]` table each (none yet):
#   citation   where the rule is stated, same form as a requirement citation in requirements.py
#              (doc path with lines, or `schema.unstable.json#/$defs/...`, ending `@ <spec commit>`)
#   statement  the spec rule, in one sentence
#   reason     why the TCK does not test it (not observable, unsafe, out of scope, ...)

# Schema `$defs` whose changes are treated like a core doc change.
core_defs = [
    "ErrorCode",
    "SessionUpdate",
    "ContentBlock",
    "AgentCapabilities",
    "ClientCapabilities",
]

[[core_doc]]
path = "docs/protocol/v1/draft/transports.mdx"
code = [
    "src/tck/common/harness",
    "src/tck/v1/conformance/test_transport.py",
    "src/tck/v1/conformance/test_diagnostics.py",
]
reason = "stdio framing, stderr/stdout split and shutdown; no other doc links here, yet every message and the whole harness depend on it"

[[core_doc]]
path = "docs/protocol/v1/draft/overview.mdx"
code = [
    "src/tck/v1/conformance/test_jsonrpc.py",
    "src/tck/v1/validation.py",
]
reason = "JSON-RPC model, lifecycle order, absolute paths, 1-based lines and the error and notification rules that feature docs restate without linking"

