[project]
name = "acp-tck"
version = "0.2.0"
description = "Test Compatibility Kit for Agent Client Protocol (ACP) agents"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/EugeneTheDev/acp-tck"
Repository = "https://github.com/EugeneTheDev/acp-tck"

[project.scripts]
acp-tck = "tck:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tck"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requirement(*ids): bind this test to one or more ids in the active protocol version's requirement registry (see the version's plugin shim, e.g. tck.v1.plugin).",
    "capability(path, boolean=False): skip this test unless the cached initialize result advertises the capability at this dotted JSON path.",
    "negotiation: this test judges version negotiation itself, so it still runs when the cached initialize was rejected with -32022.",
]
