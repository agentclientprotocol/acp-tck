citation = "docs/protocol/v1/draft/session-list.mdx:256 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "`session/archive` of a loaded session cancels any ongoing work and frees the session's resources as if `session/close` had been called, then archives it, without requiring the `close` capability."
reason = "Deferred (unstable archive): needs a prompt still in flight when the session is archived, which is race-prone against a real agent, and it is not yet tested."

[[not_requirement]]
