# Spec map for ACP v1: which parts of the spec define rules that other parts assume without
# linking to them, and which spec rules the TCK deliberately does not test. Used when comparing
# spec revisions (a change to a core doc or core `$def` means re-checking every area that depends
# on it, not just the changed lines). Loaded by `spec_tracker.spec_map`.
#
# Core doc entries:
#   path      doc path in the spec repo (draft tree, `docs/protocol/v1/draft/*.mdx`)
#   sections  optional: section addresses; omit it when the whole doc is core. An address is a
#             heading title exactly as written in the doc, or a path of titles joined by " > "
#             ("Agent > Baseline Methods") to tell apart duplicate titles. A section covers its
#             subsections. "(intro)" alone is the text before the doc's first heading;
#             "<path> > (intro)" is that heading's own text before its first child heading.
#             Inclusion only: to leave a subsection out, list its siblings and the parent's
#             "(intro)" instead of the parent.
#   code      optional: repo-relative TCK paths that implement the doc's cross-cutting rules
#   reason    why the doc is core
#
# Ledger of deliberate non-requirements, one `[[not_requirement]]` table each, grouped by doc below:
#   citation   where the rule is stated, same form as a requirement citation in requirements.py
#              (doc path with lines, or `schema.unstable.json#/$defs/...`, ending `@ <spec commit>`)
#   statement  the spec rule, in one sentence
#   reason     why the TCK does not test it (not observable, unsafe, out of scope, ...)

# Optional top-level `rfd_audit = "<spec commit>"` (put it above the first table; absent until the first
# full RFD audit): the spec revision at which every tracked RFD was last audited in full. `spec-impact`
# reports a missing marker; the update process sets it after a full RFD audit.

# Schema `$defs` whose changes are treated like a core doc change.
core_defs = [
    "ErrorCode",
    "SessionUpdate",
    "ContentBlock",
    "AgentCapabilities",
    "ClientCapabilities",
]

