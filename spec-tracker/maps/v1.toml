[[not_requirement]]
citation = "docs/protocol/v1/draft/error.mdx:37 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Receivers MUST treat an unrecognized error code as a generic failure."
reason = "Not observable: how an agent handles an unknown code in a client's error reply has no defined wire effect, and the TCK's mock client sends only well-known codes."


# --- schema.unstable.json ---

[[not_requirement]]
citation = "schema/v1/schema.unstable.json#/$defs/NewSessionRequest/properties/mcpServers; schema/v1/schema.unstable.json#/$defs/McpServerStdio/properties/args @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
