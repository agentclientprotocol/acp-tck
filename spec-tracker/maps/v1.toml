# --- session-setup.mdx ---

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-setup.mdx:473-474 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Agents SHOULD NOT treat model output, Agent content or replayed history as granting access outside the root set, and implementations that enforce the root set SHOULD check the resolved path at the time of use, compare paths by component and fail closed."
reason = "Unobservable from a client: it needs the model to attempt out-of-root access, which a driven TCK cannot trigger reliably or safely, and the path-checking mechanics are internal to the agent."

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-setup.mdx:658 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Agents SHOULD launch a stdio MCP server's `command` with `args` as separate arguments, without a shell."
reason = "Indistinguishable from correct behavior: a shell launch with correct quoting delivers the same arguments as a direct exec, so a client can only observe that arguments arrive verbatim, not whether a shell was involved."

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-setup.mdx:660 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Agents SHOULD NOT include `env` or `headers` values in model context or command lines, and SHOULD NOT log or persist them."
reason = "Unobservable from a client (model context, disk persistence, logs other than stderr); ACP-SESSION-006 covers only the stdout, stderr and stub-command-line part of the same bullet, and `headers` values are not probed."

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-setup.mdx:661 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Agents SHOULD send `headers` only to the configured origin."
reason = "Out of scope: it needs the agent to advertise `mcpCapabilities.http` and an HTTP MCP test server with a cross-origin redirect probe, which the TCK does not host."

# --- session-list.mdx ---

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-list.mdx:175 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Agents SHOULD enforce reasonable page sizes internally."
reason = "Not observable as a pass/fail: \"reasonable\" has no threshold, and a client sees a page's size only if the agent holds enough sessions to paginate."

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-list.mdx:221 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "`session/list` only discovers sessions: it does not restore or modify them."
reason = "Absence of side effects is not observable from a client; only negative evidence such as an unchanged listing is available, and the agent's store may change for unrelated reasons."

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-list.mdx:252 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "The `archived` filter combines with `cwd` and applies before pagination, and clients keep the same `cwd` and `archived` values when following `nextCursor`."
reason = "\"Before pagination\" is not observable without knowing the agent's page size, and keeping the filter values across pages is a client rule; ACP-ARCHIVE-003/006 only page with unchanged values."

[[not_requirement]]
citation = "docs/protocol/v1/draft/session-list.mdx:258 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Archive state persists across connections and restarts; closing, loading or resuming a session does not change it."
reason = "Out of scope for now: it needs a two-process test against the agent's real persistent store, and `session/load`/`session/resume` of an archived session MAY be rejected (line 257), which makes the load half inconclusive."

[[not_requirement]]
citation = "docs/rfds/get-auth-state.mdx:297 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Calling `auth/status` MUST NOT modify any agent state."
reason = "Not observable: a client cannot enumerate the agent's state; ACP-AUTH-007 only checks the answer."

[[not_requirement]]
citation = "docs/rfds/get-auth-state.mdx:303 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "`auth/status` `accounts` MUST NOT include secrets."
reason = "Not observable: the TCK cannot tell a secret from a display label."

[[not_requirement]]
citation = "docs/rfds/get-auth-state.mdx:295,301 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Agents SHOULD keep `auth/status` fast, answering `unknown` and sending `auth/status_update` later rather than blocking, and SHOULD return `unknown` rather than guess."
reason = "Not reliably observable: timing depends on the environment and \"guessing\" is internal to the agent."

[[not_requirement]]
citation = "docs/rfds/get-auth-state.mdx:307 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "Agents SHOULD send `auth/status_update` when their status changes (including after `authenticate` or `logout`), and only when it differs from the last one sent on the connection."
reason = "Out of scope for now: an RFD-only SHOULD that needs a live credential change (`--auth-method`, or the destructive `--allow-logout`), and a real agent may already be in the target state. Revisit if the RFD stabilizes."

[[not_requirement]]
citation = "docs/protocol/v1/draft/authentication.mdx:194 @ 3961af94fa62d2386d993cadf1afc8b146fc799a"
statement = "A terminal auth method's `env` values SHOULD NOT contain secrets."
reason = "Not observable: the TCK cannot classify an `env` value as secret."
