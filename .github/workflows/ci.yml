name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked

      # The end-to-end CLI tests mostly wait on agent subprocesses, so they parallelize well
      # (pytest's addopts in pyproject.toml runs them in parallel).
      - name: Run test suite
        run: uv run pytest -q

      # spec-tracker's tests check the spec maps against the spec docs at each version's vendored
      # schema revision (SCHEMA_REVISION in protocol.py); under CI they fail, not skip, if this
      # checkout is missing. Fetch every distinct pinned revision.
      - name: Fetch spec repo (pinned revisions)
        run: |
          spec_dir="$RUNNER_TEMP/acp-spec"
          mkdir -p "$spec_dir"
          git -C "$spec_dir" init -q
          git -C "$spec_dir" remote add origin https://github.com/agentclientprotocol/agent-client-protocol
          revisions=$(uv run python -c 'from tck.v1.protocol import SCHEMA_REVISION as v1; from tck.v2.protocol import SCHEMA_REVISION as v2; print(*sorted({v1, v2}))')
          for sha in $revisions; do
            git -C "$spec_dir" fetch --depth 1 origin "$sha"
          done

      - name: Test spec-tracker
        run: uv run --locked --package spec-tracker pytest spec-tracker/tests -q --spec-repo "$RUNNER_TEMP/acp-spec"

  # The cross-check is informational: independently implemented upstream agents are expected to
  # FAIL some requirements, so a red result here does not mean the TCK broke. It needs nothing from
  # `test`, so it starts right away. Each agent runs on its own runner, so the TCK runs never share
  # CPUs (several checks are timing-sensitive), and the last job checks all four reports.
  cross-check-agent:
    name: cross-check ${{ matrix.leg }} (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: testy
            rust: true
            cargo-target: target
          - leg: echo_agent
          - leg: testy_v2
            rust: true
            # run.sh builds the v2 testy into its own target dir, scratch/cross-check/target-v2.
            cargo-target: ../../target-v2
          - leg: python_v2_agent
    steps:
      - name: Checkout acp-tck
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install Rust toolchain
        if: matrix.rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (rust-sdk)
        if: matrix.rust
        uses: Swatinem/rust-cache@v2
        with:
          # run.sh fetches the pinned rust-sdk (cross-check/sdk-pins.sh) into this directory.
          workspaces: scratch/cross-check/sdks/rust-sdk -> ${{ matrix.cargo-target }}
          key: rust-sdk-${{ matrix.leg }}-${{ hashFiles('cross-check/sdk-pins.sh') }}

      - name: Run cross-check (${{ matrix.leg }})
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: ./cross-check/run.sh ${{ matrix.leg }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cross-check-${{ matrix.leg }}
          # A fresh runner holds only this leg's report at the top of scratch/cross-check/.
          path: scratch/cross-check/*.json
          if-no-files-found: error

  cross-check:
    name: cross-check (informational)
    needs: cross-check-agent
    # Run even if an agent's job failed: a missing report then fails the check below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout acp-tck
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked --directory cross-check

      - name: Test cross-check tooling
        run: uv run --directory cross-check --locked pytest -q

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: cross-check-*
          merge-multiple: true
          path: scratch/cross-check

      # `run.sh` exits 0 once it has run its agent and written the JSON report: the agents' own
      # scorecards are data, not the script's success, so a drifted baseline (e.g. python_v2_agent
      # suddenly failing something new) would not turn an agent's job red. Check the four reports
      # against the documented baseline here, so this step's exit code reflects whether the
      # scorecard still matches it.
      - name: Check expected scorecard (v1 + v2 baselines)
        run: |
          uv run --no-sync --project cross-check python cross-check/summary.py \
            scratch/cross-check/testy.json testy \
            scratch/cross-check/echo_agent.json echo_agent \
            --report scratch/cross-check/testy-v2.json testy_v2 \
            --report scratch/cross-check/python-v2.json python_v2_agent \
            --expect "testy=" \
            --expect "echo_agent=ACP-INIT-003" \
            --expect "testy_v2=ACP-INIT-205,ACP-INIT-211" \
            --expect "python_v2_agent=ACP-INIT-003,ACP-INIT-202,ACP-INIT-205,ACP-INIT-206,ACP-INIT-212,ACP-INIT-214"
